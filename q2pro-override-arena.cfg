// q2pro-specific overrides for the arena server.
//
// Intentionally does not change sv_downloadserver. arena's own r1q2srv.cfg
// points at http://q2.packetflinger.com/dl/ , which already serves arena
// content under the correct arena/ gamedir path - verified for
// ra2map27.bsp (byte-identical to this server's copy) and for custom
// texture sets such as arenarg/*. So unlike xatrix, no repoint is needed.
//
// This file exists so both gamedirs can share one CMD (+exec
// $Q2_OVERRIDE_CFG) and so there is an obvious place to put any future
// arena-only q2pro tweak.
