# Rotates the persistent console.log files the arena/xatrix containers'
# CMD `tee -a`s into (see Dockerfile). Run via host cron against this
# config explicitly - not dropped into /etc/logrotate.d/, and invoked with
# an explicit --state file in nils's own home directory, since neither
# system-cron's own logrotate invocation nor a system state path is usable
# without root, and this host has no passwordless sudo (see project
# CLAUDE.md's Known issues). Every file below is already owned by nils
# (same UID the containers run as), so nothing here needs privilege.
#
# copytruncate, not the default rename+recreate: `tee -a` opens the file
# once, in O_APPEND mode, for the life of the container, and nothing tells
# it to reopen a freshly-renamed-away path. Renaming console.log to
# console.log.1 would leave tee still writing into the renamed file (now
# invisible under the original name) forever, while the original path
# would need a fresh file to reappear there - it wouldn't. copytruncate
# copies the current content out, then truncates the ORIGINAL file in
# place (same inode) - because the writer uses O_APPEND, the kernel always
# writes at current end-of-file, so truncating externally just moves that
# point back to 0 and the very next write lands there correctly, no
# reopen needed. Small accepted risk: a write landing between the copy and
# the truncate is lost - fine for a console log, nothing here depends on
# that for correctness.

/home/nils/quake2/arena/logs/console.log
/home/nils/quake2/xatrix/logs/console.log
{
    size 20M
    rotate 12
    compress
    copytruncate
    missingok
    notifempty
}
