// q2pro-specific overrides for the xatrix server.
//
// Exec'd from the container CMD *after* server1.cfg so this wins. A
// command-line "+set" cannot do it: q2pro processes every +set in an early
// phase, before any +exec, so server1.cfg/r1q2srv.cfg would clobber it
// regardless of argument order.

// r1q2srv.cfg sets this to http://tastyspleen.net/~quake2/ , which is wrong
// for a q2pro/yquake2 client. Clients request
// <sv_downloadserver><gamedir>/<path>, and that host stores this content as
// *baseq2* content - so e.g. the 13 custom evl/*.wal textures the marics39
// map needs live at baseq2/textures/evl/ and 404 at xatrix/textures/evl/.
// A 404 is non-fatal to the client, which simply skips the file, so maps
// render with missing textures and nothing at all is logged server-side
// (HTTP downloads go client -> host directly, never touching this server).
//
// http_linkfarm/ exposes the identical files under every gamedir path.
// Confirmed working end-to-end with a real yquake2 client against a cleared
// client cache.
set sv_downloadserver "http://tastyspleen.net/~quake2/http_linkfarm/"
