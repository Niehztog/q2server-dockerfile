# ONE IMAGE FOR BOTH GAME SERVERS.  There were two, q2pro-arena and
# q2pro-xatrix, because GAME_ABI_HACK is a whole-binary compile-time switch
# and the two mods then in use needed opposite settings: arena's 2014 Rocket
# Arena 2 binary wanted the old callee-pops convention for gi.trace(), and
# xatrix's 2017 openffa build crashed if it was compiled in.  Both servers
# moved to colosseum on 2026-09-18 -- one modern-gcc build, one convention --
# so the two images had become byte-identical but for their build timestamp.
# Verified before collapsing them: q2admin's gamei386.so matched exactly and
# q2proded differed in 32 bytes of GNU build-ID and nothing else.
#
# What was ever per-server is the ENVIRONMENT below, not the image: gamedir,
# port, and which override cfg to exec.  If a future mod ever needs the abi
# hack again, split this back into two images rather than flipping the arg --
# the engine and the game library must always agree.
x-q2pro-build: &q2pro-build
  context: /home/nils/projects/q2server-dockerfile
  dockerfile: Dockerfile
  # The engine-and-q2admin target. The same Dockerfile also builds the
  # colosseum game library under --target colosseum, out of the same named
  # context declared below.
  target: server
  # THE COLOSSEUM CLONE, WHICH THIS TARGET ALSO NEEDS NOW.  It is the source
  # for the game library under --target colosseum, and for this target it is
  # where the ENGINE PATCHES come from: colosseum/server/q2pro/, applied to
  # q2proded so that the game's bots are reported as players instead of the
  # server advertising itself empty with eight of them playing.
  #
  # Until that patch this target resolved no named context at all and built
  # with no colosseum clone present -- see the corrected note on the colosseum
  # target in the Dockerfile.  Needs Compose v2.17 or newer.
  additional_contexts:
    colosseum-src: /home/nils/projects/colosseum
  args:
    # Both servers run colosseum, built by this same Dockerfile under
    # --target colosseum with a modern gcc and installed into the gamedir as gamei386.real.so by
    # scripts/deploy-colosseum-live.sh, so the engine must use the modern
    # caller-pops convention for gi.trace().
    #
    # Learned the hard way on 2026-08-19, when a freshly-compiled game
    # library met an engine still built with 'enabled': immediate SIGSEGV on
    # server init, right after the MOTD loads, confirmed via gdb against the
    # actual core dump.
    GAME_ABI_HACK: 'disabled'

services:
  q2pro-arena:
    build: *q2pro-build
    image: q2pro-server
    environment:
      Q2_GAMEDIR: 'arena'
      Q2_OVERRIDE_CFG: 'q2pro-override-arena.cfg'
      Q2_IP: 'localhost'
      Q2_PORT: '27910'
    restart: always
    init: true
    ports:
    - "27910:27910/udp"
    - "27910:27910/tcp"
    volumes:
    - /home/nils/quake2:/opt/quake2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  q2pro-xatrix:
    build: *q2pro-build
    image: q2pro-server
    environment:
      Q2_GAMEDIR: 'xatrix'
      Q2_OVERRIDE_CFG: 'q2pro-override-xatrix.cfg'
      Q2_IP: 'localhost'
      Q2_PORT: '27911'
    restart: always
    init: true
    ports:
    - "27911:27911/udp"
    - "27911:27911/tcp"
    volumes:
    - /home/nils/quake2:/opt/quake2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  q2admin-cloud:
    build:
      context: /home/nils/projects/q2server-dockerfile
      dockerfile: Dockerfile-q2admin-cloud
    image: q2admin-cloud
    # No panic recovery anywhere in q2admin-cloud's codebase - a single bad
    # message from either game server can in principle take the whole
    # process down. Fast auto-recovery matters more here than for
    # daikatana's `unless-stopped`, so this matches arena/xatrix instead.
    restart: always
    init: true
    environment:
      # Lets this LAN-only deployment skip real OAuth for the web UI login
      # without baking anything into the (public) q2admin-cloud repo - see
      # Dockerfile-q2admin-cloud. Sourced from .env (gitignored), never
      # hardcode a real value directly in this file.
      AUTH_BYPASS_EMAIL: ${AUTH_BYPASS_EMAIL:-}
    ports:
    # Web/API port only. The game-TCP port (9988) that arena/xatrix
    # actually connect to is reached over the default Compose network via
    # the service name - it never needs to touch the host's LAN-facing
    # ports at all. RPC and SSH admin-terminal ports run inside the
    # container too (both start unconditionally) but are deliberately not
    # published here, so this is the only new LAN-facing surface this
    # deployment adds.
    - "192.168.1.38:8087:8087/tcp"
    volumes:
    - /home/nils/q2admin-cloud:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  daikatana:
    build:
      context: /home/nils/Daikatana-Linux-2025-12-21-x64
      dockerfile: /home/nils/projects/q2server-dockerfile/Dockerfile-daikatana
    image: daikatana-server
    restart: unless-stopped
    init: true
    ports:
    - "27982:27982/udp"
    - "27982:27982/tcp"
    - "27992:27992/udp"
    - "27992:27992/tcp"
    volumes:
    - /home/nils/Daikatana-Linux-2025-12-21-x64/data:/opt/daikatana/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
