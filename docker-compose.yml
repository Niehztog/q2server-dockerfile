services:
  q2pro-arena:
    build:
      context: /home/nils/projects/q2server-dockerfile
      dockerfile: Dockerfile
      args:
        # arena's gamei386.real.so (2014) needs the old callee-pops
        # struct-return convention for gi.trace(). See Dockerfile.
        GAME_ABI_HACK: 'enabled'
    image: q2pro-arena
    environment:
      Q2_GAMEDIR: 'arena'
      Q2_OVERRIDE_CFG: 'q2pro-override-arena.cfg'
      Q2_IP: 'localhost'
      Q2_PORT: '27910'
    restart: always
    init: true
    ports:
    - "27910:27910/udp"
    - "27910:27910/tcp"
    volumes:
    - /home/nils/quake2:/opt/quake2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  q2pro-xatrix:
    build:
      context: /home/nils/projects/q2server-dockerfile
      dockerfile: Dockerfile
      args:
        # xatrix's gamei386.real.so (2017) expects the MODERN convention and
        # crashes if the abi hack is compiled in. Stated explicitly rather
        # than relying on the default.
        GAME_ABI_HACK: 'disabled'
    image: q2pro-xatrix
    environment:
      Q2_GAMEDIR: 'xatrix'
      Q2_OVERRIDE_CFG: 'q2pro-override-xatrix.cfg'
      Q2_IP: 'localhost'
      Q2_PORT: '27911'
    restart: always
    init: true
    ports:
    - "27911:27911/udp"
    - "27911:27911/tcp"
    volumes:
    - /home/nils/quake2:/opt/quake2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  daikatana:
    build:
      context: /home/nils/Daikatana-Linux-2025-12-21-x64
      dockerfile: /home/nils/projects/q2server-dockerfile/Dockerfile-daikatana
    image: daikatana-server
    restart: unless-stopped
    init: true
    ports:
    - "27982:27982/udp"
    - "27982:27982/tcp"
    - "27992:27992/udp"
    - "27992:27992/tcp"
    volumes:
    - /home/nils/Daikatana-Linux-2025-12-21-x64/data:/opt/daikatana/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
